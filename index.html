<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9c4a32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <script>
    // Tema escolhido (claro/escuro) aplicado antes de desenhar a página, para não piscar.
    try {
      var t = localStorage.getItem('porcos:tema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* sem armazenamento */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Controle de Porcos</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Entrada: carregando, login ou sem acesso -->
  <section class="gate" id="gate">
    <div class="gate-card">
      <span class="logo big" data-logo aria-hidden="true"></span>
      <h1>Controle de Porcos</h1>
      <div id="gateBody"><p class="muted">Carregando…</p></div>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/inicio" aria-label="Início">
        <span class="logo" data-logo aria-hidden="true"></span>
        <span class="brand-text">
          <strong>Porcos</strong>
          <small>Controle do plantel</small>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="Seções">
        <a href="#/inicio" data-route="inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg>
          <span>Início</span>
        </a>
        <a href="#/animais" data-route="animais">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="7.5" ry="6.5"/><path d="M6.5 8.2 5 4.5l4 2M17.5 8.2 19 4.5l-4 2"/><ellipse cx="12" cy="15" rx="3" ry="2"/><path d="M11 15h0M13 15h0"/></svg>
          <span>Animais</span>
        </a>
        <a href="#/crias" data-route="crias">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5c-4.4 0-7.5-2.4-7.5-6 0-4.2 3.6-9 7.5-11 3.9 2 7.5 6.8 7.5 11 0 3.6-3.1 6-7.5 6z"/><path d="M9 14.5c.8 1 1.8 1.5 3 1.5s2.2-.5 3-1.5"/></svg>
          <span>Crias</span>
        </a>
        <a href="#/saude" data-route="saude">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 4.5 5 5M17 7l-8.5 8.5M12 5.5l6.5 6.5M7 13.5l3.5 3.5M8.5 15.5 4 20"/></svg>
          <span>Saúde</span>
        </a>
        <a href="#/racao" data-route="racao">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8.5h12l-1.3 11a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8 8.5c0-2.5 1.8-4.5 4-4.5s4 2 4 4.5"/><path d="M9.5 13h5"/></svg>
          <span>Ração</span>
        </a>
        <a href="#/financas" data-route="financas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M15.5 15h2.5"/></svg>
          <span>Finanças</span>
        </a>
      </nav>

      <div class="top-right">
        <button type="button" class="btn primary install-btn" id="btnInstall" hidden>Instalar app</button>
        <button type="button" class="icon theme-btn" id="btnTheme" aria-label="Mudar para o modo escuro" title="Mudar para o modo escuro">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <a class="user" id="account" href="#/conta" title="Conta e acesso"></a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Formulários (montados pelo app.js) -->
  <dialog id="dlg">
    <form method="dialog" class="dlg" id="dlgForm" novalidate></form>
  </dialog>

  <input type="file" id="fotoInput" accept="image/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
